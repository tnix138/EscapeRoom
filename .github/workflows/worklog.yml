name: worklog

# گارد سیستم لاگ تیمی:
#  - اعتبارسنجی فراداده و چرخه عمر همه فایل‌های logs/
#  - هم‌خوانی دقیق جدول‌های WORKLOG.md با فایل‌ها
#  - اجرای تست‌های خود سیستم لاگ
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    name: بررسی لاگ‌ها
    runs-on: ubuntu-latest
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: راه‌اندازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: اعتبارسنجی لاگ‌ها و WORKLOG
        run: node scripts/worklog.mjs check

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: تست سیستم لاگ
        run: npx vitest run tests/worklog
